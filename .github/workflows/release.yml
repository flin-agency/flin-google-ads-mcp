name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
      - name: Verify release version
        run: |
          python - <<'PY'
          import json, os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert json.load(open('manifest.json'))['version'] == version
          assert os.environ['GITHUB_REF_TYPE'] == 'tag', "Run releases on a v* tag, not a branch."
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'
          PY
      - name: Test and audit
        run: |
          uv sync --locked --extra dev
          uv run --locked python -m pytest
          uv export --locked --no-dev --no-emit-project --output-file /tmp/requirements.txt
          uvx --python 3.12 pip-audit==2.10.1 -r /tmp/requirements.txt --no-deps --disable-pip
      - name: Build and verify
        run: |
          uv build
          uv run --locked python scripts/build_mcpb.py
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          uv run --locked python scripts/smoke_mcpb.py dist/*.mcpb --wheel dist/*.whl --expected-version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  publish-github:
    needs: verify-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: dist
      - name: Publish installable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG — Claude Desktop for Mac" --notes 'Install the .mcpb file in Claude Desktop Settings → Extensions → Advanced settings → Install Extension. Setup and security details: https://github.com/flin-agency/flin-google-ads-mcp/blob/main/docs/claude-desktop-mac.md'
          fi

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/flin-google-ads-mcp
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: artifacts
      - name: Select only Python distributions
        run: |
          mkdir dist
          cp artifacts/*.whl artifacts/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true

  verify-pypi:
    needs: publish-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release
          path: dist
      - name: Verify published distributions and actual PyPI launch
        run: |
          python scripts/verify_pypi.py
          uv sync --locked --extra dev
          uv run --locked python scripts/smoke_mcpb.py dist/*.mcpb --expected-version "${GITHUB_REF_NAME#v}"
