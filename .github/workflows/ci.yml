name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.11'
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Tests and compile check
        run: |
          uv run --locked python -m pytest
          uv run --locked python -m compileall -q src desktop scripts
      - name: Audit runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --output-file /tmp/requirements.txt
          uvx --python 3.12 pip-audit==2.10.1 -r /tmp/requirements.txt --no-deps --disable-pip
      - name: Build Python and Claude Desktop packages
        run: |
          uv build
          uv run --locked python scripts/build_mcpb.py
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - name: Test extracted Claude Desktop package
        run: uv run --locked python scripts/smoke_mcpb.py dist/*.mcpb
